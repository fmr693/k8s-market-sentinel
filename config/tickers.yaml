fred_series: # Series macro de FRED (ingestor propio, no yfinance)
  - BAMLH0A0HYM2 # ICE BofA US High Yield OAS (diferencial de crédito HY)
  # Contexto histórico LARGO del estrés de crédito (añadida 2026-07-30).
  # Por qué hace falta: la serie de arriba es la buena para CEFs de crédito,
  # pero FRED solo publica una ventana móvil de ~3 años (restricción de
  # licencia de ICE, confirmada en los metadatos: observation_start es
  # 2023-07-31, no es que la API recorte — el dato no existe ahí). Con 3 años
  # no se puede juzgar si un nivel es alto o bajo: 2,84% parece "normal" en
  # esa ventana y es históricamente estrecho.
  # BAA10Y llega a 1986 (40 años) y NO está restringida. Es grado de inversión
  # (Baa, el escalón más bajo) sobre el Treasury 10Y, así que sus NIVELES son
  # más bajos que los de HY — no son intercambiables. Lo que aporta es la
  # FORMA: se ven 2008, 2020 y cada episodio de estrés, y eso da la escala
  # que la ventana corta no puede dar.
  # Añadirla es editar este YAML: el ingestor y el esquema no cambian.
  - BAA10Y # Moody's Baa - Treasury 10Y (proxy de estrés de crédito, 1986→)
  - DGS10 # Treasury a 10 años
  - GDP # PIB nominal trimestral (denominador del Buffett)

fx_pairs: # Tipos oficiales del BCE vía frankfurter.app (publicados ~16:00 CET, definitivos)
  # El EURUSD=X de yfinance es la cotización de mercado intradía; ESTE es el
  # fixing oficial diario — la banda 1,10–1,20 de las alertas se evalúa contra él.
  - EUR/USD

nav_check: # Cross-check del NAV (fase 10): CEF -> ticker de yfinance cuyo close ES el NAV.
  # Yahoo publica el NAV de los CEFs con el patrón X<TICKER>X (verificado en vivo:
  # XWDIX 14,19, XFSCX 7,13...). El NAV de gold.nav_crosscheck compara este proxy
  # con el de CEFConnect; si divergen >2%, cef_snapshot degrada nav_quality a
  # 'sospechoso' (la evidencia de FSCO del brief). Config-driven: corregir aquí.
  WDI: XWDIX
  KIO: XKIOX
  BIT: XBITX
  HYT: XHYTX
  BTZ: XBTZX
  BHK: XBHKX
  DSL: XDSLX
  FSCO: XFSCX
  BGH: XBGHX
  ARDC: XARDCX
  GHY: XGHYX
  OPP: XOPPX
  PDI: XPDIX
  PDO: XPDOX
  PTY: XPTYX
  BST: XBSTX
  ECAT: ECAT # rareza de la API: su NAVTicker es él mismo, no sigue el patrón X…X
  # BCAT y ADX omitidos: Yahoo no lista su NAV (XBCATX/XADXX → 404). Hueco
  # documentado (como otros de la fuente NAV); en el panel se ven sin cross-check.

defaults:
  # Si un ticker no tiene datos aún, el backfill arranca aquí.
  # ~10 años: suficiente para z-scores a 1 año con contexto de ciclo completo.
  price_history_start: "2015-01-01"
  # Días que re-pedimos por detrás del último dato al reanudar (over-fetch):
  # corrige la última vela si se guardó parcial y absorbe revisiones de Yahoo.
  overlap_days: 5
  # Solape para series FRED: mayor que el de precios porque FRED revisa
  # hacia atrás (el PIB se revisa meses después de publicarse).
  macro_overlap_days: 30
  # Inicio del backfill de las MACRO, separado del de precios (2015) porque el
  # criterio es otro: una serie macro existe para dar CONTEXTO histórico, y con
  # 11 años no se ve ni una crisis de verdad.
  #
  # ¿Por qué 2007 y no más atrás? Es el mínimo que incluye 2008, que es LA
  # referencia de cómo se ve un susto de crédito real (BAA10Y llegó a 6,16%
  # frente al 1,62% de hoy). Con eso basta para juzgar si el nivel actual es
  # alto o bajo; traerse los años 80 y 90 no añade criterio y alarga el primer
  # arranque. Escape: bajar esta fecha si algún día interesa más profundidad.
  #
  # OJO — esto solo aplica a un backfill INICIAL. El patrón "¿cuál es mi último
  # dato?" solo extiende hacia ADELANTE: nunca rellena hueco por detrás del
  # primer registro. Si una serie ya está ingerida, cambiar esta fecha no la
  # afecta; hay que borrar esa serie de silver y dejar que se reingiera.
  # Cuánto se PINTA es otra cosa y no depende de aquí: lo decide el selector de
  # tiempo de Grafana, porque los paneles filtran por el rango elegido.
  macro_history_start: "2007-01-01"
  # Cadencia del poller intradía (duda #4: config-driven, ~60-90s). Más
  # rápido no aporta (el dato de Yahoo ya llega ~15 min retrasado) y solo
  # gasta presupuesto de rate-limit y almacenamiento.
  poll_interval_seconds: 75
  # Tickers que se ingestan en DIARIO pero NO en intradía. ^W5000 (Wilshire)
  # no tiene velas 1m en Yahoo → cada tick del poller logueaba 2 líneas de
  # error por él. Su única función (numerador del Buffett) se calcula sobre
  # velas diarias, así que excluirlo del carril intradía no pierde nada.
  # Config-driven puro: añadir/quitar aquí, el código no cambia.
  intraday_exclude:
    - ^W5000
