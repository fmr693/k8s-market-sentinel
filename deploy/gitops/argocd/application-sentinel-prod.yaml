# Las Applications de ArgoCD del entorno PROD (Neon).
#
# Espejo de application-sentinel-local.yaml (ver allí el porqué de las DOS
# Applications). La diferencia: sentinel-prod-secrets apunta a deploy/gitops/prod
# (descifra sentinel-env.prod.yaml = Neon) en vez de deploy/gitops/local.
# La raíz (sentinel-prod, path '.') es la MISMA app env-agnostic.
#
# IMPORTANTE: no bootstrapear a la vez que las Applications 'local' — ambas
# gestionarían los mismos recursos del namespace sentinel. Un entorno por
# clúster: aquí, Neon.
#
# Bootstrap (una vez): kubectl apply -f deploy/gitops/argocd/application-sentinel-prod.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sentinel-prod
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/fmr693/k8s-market-sentinel.git
    targetRevision: main
    path: . # la raíz: el chart de Helm con todo el despliegue de la app
    # Declarado EXPLÍCITO aunque ArgoCD sabría autodetectarlo por el Chart.yaml
    # de la raíz: el tipo de fuente decide cómo se renderiza todo el despliegue
    # y no debe depender de qué fichero encuentre primero un autodetector.
    # (Por eso mismo la raíz no puede tener a la vez Chart.yaml y
    # kustomization.yaml — al migrar a Helm, el segundo se borró.)
    #
    # El repo-server renderiza con SU Helm embebido (3.19.4), no con el de la
    # máquina de desarrollo: el chart se mantiene compatible con Helm 3.
    helm:
      releaseName: sentinel
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: sentinel
  # El túnel de demo (templates/cloudflared.yaml) se declara con replicas: 0 y
  # se enciende A MANO mientras dura la demo. Sin esta excepción, el selfHeal
  # revertiría el `kubectl scale --replicas=1` a los pocos minutos y el túnel
  # se caería en mitad de la demostración.
  #
  # Es la única deriva manual que se tolera en todo el despliegue, y es
  # deliberada: el estado deseado en git sigue siendo "apagado" (si el clúster
  # se recrea, el túnel NO se reabre solo), pero encenderlo no exige un commit.
  ignoreDifferences:
    - group: apps
      kind: Deployment
      name: cloudflared
      jsonPointers:
        - /spec/replicas
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # Hacen falta LAS DOS cosas, y confundirlas cuesta una demo:
      #   - ignoreDifferences (arriba) = "no mires este campo para decidir si
      #     hay deriva"  → evita que el selfHeal lo revierta.
      #   - RespectIgnoreDifferences  = "y tampoco lo apliques al sincronizar"
      #     → evita que un sync disparado por OTRA causa (un commit cualquiera)
      #     reimponga el replicas: 0 del repo y apague el túnel a media demo.
      # Sin la segunda, el túnel se cae en el siguiente push, que es justo
      # cuando menos te lo esperas.
      - RespectIgnoreDifferences=true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sentinel-prod-secrets
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/fmr693/k8s-market-sentinel.git
    targetRevision: main
    path: deploy/gitops/prod # solo el Secret (Neon), vía KSOPS
  destination:
    server: https://kubernetes.default.svc
    namespace: sentinel
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
