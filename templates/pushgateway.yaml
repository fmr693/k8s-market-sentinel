{{/*
Pushgateway: el buzón de métricas de los jobs BATCH.

Los CronJobs viven MENOS que un scrape de Prometheus (nacen, ingieren, mueren
en segundos) -> no se pueden scrapear directo. Empujan sus métricas aquí al
salir (el patrón canónico que recomiendan los propios docs de Prometheus para
jobs batch), y Prometheus scrapea al Pushgateway (honor_labels: true en
prometheus.yml para conservar el label 'job' del que empuja).

SIN PVC a propósito: las métricas son efímeras y se re-empujan en cada
ejecución; si el pod muere se pierden hasta el siguiente push. Contraste
deliberado con Prometheus, cuya TSDB SÍ lleva PVC (el "trofeo stateful").
*/}}
{{- if .Values.pushgateway.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pushgateway
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: pushgateway
    {{- include "sentinel.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: pushgateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pushgateway
        {{- include "sentinel.labels" . | nindent 8 }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534 # 'nobody', el usuario por defecto de prom/pushgateway
        runAsGroup: 65534
      containers:
        - name: pushgateway
          image: {{ .Values.pushgateway.image }}
          ports:
            - containerPort: 9091
              name: http
          resources:
            {{- toYaml .Values.pushgateway.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /-/ready
              port: 9091
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: 9091
            initialDelaySeconds: 15
            periodSeconds: 30
            failureThreshold: 3
---
# ClusterIP: infra interna. Los CronJobs empujan a este DNS (PUSHGATEWAY_URL) y
# Prometheus lo scrapea por el mismo nombre. Su UI, si hace falta: port-forward.
apiVersion: v1
kind: Service
metadata:
  name: pushgateway
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: pushgateway
    {{- include "sentinel.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: pushgateway
  ports:
    - name: http
      port: 9091
      targetPort: 9091
{{- end }}
